<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GOMIO - Submission Successful</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link rel="icon" type="image/png" sizes="32x32" href="img/GOMIO_logo-removebg-preview (1).png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      color: #22304b;
    }
    .success-container {
      background: rgba(255, 255, 255, 0.99);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(18, 56, 128, 0.12);
      padding: 60px 45px;
      text-align: center;
      max-width: 640px;
      width: 100%;
      border: 1px solid rgba(13, 110, 253, 0.12);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .success-icon {
      width: 94px;
      height: 94px;
      background: linear-gradient(135deg, #ffb703 0%, #ff9800 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 16px 32px rgba(255, 151, 0, 0.18);
      animation: scaleIn 0.5s ease-out 0.3s both;
    }
    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    .success-icon i {
      color: white;
      font-size: 42px;
    }
    .success-title {
      font-size: 2.6rem;
      font-weight: 800;
      color: #0d6efd;
      margin-bottom: 18px;
    }
    .success-message {
      font-size: 1.05rem;
      color: #495057;
      margin-bottom: 16px;
      line-height: 1.75;
    }
    .countdown {
      font-size: 1rem;
      color: #6c757d;
      margin-top: 16px;
      margin-bottom: 28px;
    }
    .btn-group-success {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .btn-success-custom {
      padding: 12px 28px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
      color: white;
      border: none;
    }
    .btn-primary-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(13, 110, 253, 0.18);
      color: white;
    }
    .btn-secondary-custom {
      background: #f8f9fa;
      color: #0d6efd;
      border: 1px solid rgba(13, 110, 253, 0.15);
    }
    .btn-secondary-custom:hover {
      background: #e9ecef;
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>
    
    <h1 class="success-title">Thank You!</h1>
    
    <p class="success-message">
      <strong>Your submission has been received successfully.</strong>
    </p>
    
    <p class="success-message">
      We've received your information and will review it shortly. Our team will contact you within 24 hours.
    </p>
    
    <div class="countdown">
      Redirecting in <span id="countdown">5</span> seconds...
    </div>
    
    <div class="btn-group-success">
      <a href="index.html" class="btn btn-success-custom btn-primary-custom">
        <i class="fas fa-home me-2"></i>Back to Home
      </a>
      <a href="javascript:history.back()" class="btn btn-success-custom btn-secondary-custom">
        <i class="fas fa-arrow-left me-2"></i>Go Back
      </a>
    </div>

    <nav class="mt-4" aria-label="Legal links">
      <a class="mx-2" href="privacy-policy.html">Privacy Policy</a>
      <a class="mx-2" href="return-policy.html">Return Policy</a>
      <a class="mx-2" href="terms.html">Terms of Use</a>
    </nav>
  </div>

  <script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');

    const interval = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>

</body>
</html>
